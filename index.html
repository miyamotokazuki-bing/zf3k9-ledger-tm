// ---------- CALENDAR ----------
function renderTxRow(t){
  const c = catOf(t.categoryId);
  const commentShort = t.comment ? (t.comment.length > 15 ? t.comment.slice(0,15) + '…' : t.comment) : '';
  return `
    <div class="tx-row">
      <span class="name">${c.icon} ${c.name} ${t.isFixed ? '<span class="fixed-badge">固定</span>' : ''} ${t.diningOut===true ? '<span class="fixed-badge">外食</span>' : ''} ${t.diningOut==='bento' ? '<span class="fixed-badge">弁当</span>' : ''}</span>
      ${commentShort ? `<span class="tx-comment">${commentShort}</span>` : ''}
      <span class="amt" style="color:${t.type==='income'?TOKENS.moss:TOKENS.bengara}">${t.type==='income'?'+':'-'}${yen(t.amount)}</span>
    </div>
  `;
}

function renderDayDetailBlock(dateStr, dayList){
  return `
    <div class="day-detail">
      <div class="ttl">${dateStr} の記録</div>
      ${dayList.length===0 ? `<div class="empty" style="padding:10px 0;">記録なし</div>` : dayList.map(t=>renderTxRow(t)).join("")}
    </div>
  `;
}

function renderCalendar(){
  const viewSwitch = `
    <div class="switch">
      <button data-calview="month" class="${state.calendarView!=='week'?'active':''}">月</button>
      <button data-calview="week" class="${state.calendarView==='week'?'active':''}">週</button>
    </div>
  `;
  return `<div class="pad">${viewSwitch}${state.calendarView==='week' ? renderWeekView() : renderMonthView()}</div>`;
}

function renderMonthView(){
  const year = state.cursorYear, month = state.cursorMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = daysInMonthOf(year, month);
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;

  const allTx = state.transactions.filter(t=>t.date.startsWith(monthKey)).concat(fixedTxForMonth(year, month));

  const byDay = {};
  allTx.forEach(t=>{
    if(!byDay[t.date]) byDay[t.date] = {income:0, expense:0, hasPhoto:false};
    byDay[t.date][t.type] += t.amount;
    if(t.photo) byDay[t.date].hasPhoto = true;
  });

  let cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const cellsHtml = cells.map(d=>{
    if(!d) return `<div></div>`;
    const key = `${monthKey}-${String(d).padStart(2,'0')}`;
    const info = byDay[key];
    const sel = state.selectedDay===key;
    return `
      <button class="day-cell ${info?'has':''} ${sel?'sel':''}" data-day="${key}">
        <span class="d">${d}</span>
        ${info && info.expense>0 ? `<span class="amt">-${info.expense>=1000?Math.round(info.expense/1000)+'k':info.expense}</span>` : ''}
        ${info && info.hasPhoto ? `<span class="dot"></span>` : ''}
      </button>
    `;
  }).join("");

  const detailHtml = state.selectedDay ? renderDayDetailBlock(state.selectedDay, allTx.filter(t=>t.date===state.selectedDay)) : "";

  return `
    <div class="cal-head">
      <button class="nav-round" id="prevMonth">‹</button>
      <span class="ym">${year}年 ${month+1}月</span>
      <button class="nav-round" id="nextMonth">›</button>
    </div>
    <div class="weekrow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid">${cellsHtml}</div>
    ${detailHtml}
  `;
}

function renderWeekView(){
  if(!state.weekAnchor) state.weekAnchor = fmtDate(startOfWeek(TODAY));
  const anchor = new Date(state.weekAnchor+'T00:00:00');
  const dates = Array.from({length:7},(_,i)=>{ const d=new Date(anchor); d.setDate(anchor.getDate()+i); return fmtDate(d); });
  const weekdayLabels=["日","月","火","水","木","金","土"];

  const infos = dates.map(dt=>{
    const tx = txForDate(dt);
    const income = tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const hasPhoto = tx.some(t=>t.photo);
    return {dt, income, expense, hasPhoto, tx};
  });
  const weekExpenseTotal = infos.reduce((s,i)=>s+i.expense,0);
  const weekIncomeTotal = infos.reduce((s,i)=>s+i.income,0);
  const rangeLabel = `${dates[0].slice(5).replace('-','/')} 〜 ${dates[6].slice(5).replace('-','/')}`;

  const cellsHtml = infos.map((info,i)=>{
    const sel = state.selectedDay===info.dt;
    const dayNum = Number(info.dt.slice(8,10));
    return `
      <button class="day-cell ${(info.income||info.expense)?'has':''} ${sel?'sel':''}" data-day="${info.dt}" style="aspect-ratio:auto; padding:10px 2px;">
        <span style="font-size:9px;color:var(--ink60);">${weekdayLabels[i]}</span>
        <span class="d">${dayNum}</span>
        ${info.expense>0 ? `<span class="amt">-${info.expense>=1000?Math.round(info.expense/1000)+'k':info.expense}</span>` : ''}
        ${info.hasPhoto ? `<span class="dot"></span>` : ''}
      </button>
    `;
  }).join("");

  const hasAny = infos.some(i=>i.tx.length>0);
  const listHtml = !hasAny
    ? `<div class="empty" style="padding:20px 0;">この週の記録はまだありません</div>`
    : infos.filter(i=>i.tx.length>0).map(info=>`
        <div class="day-detail" style="margin-top:14px;">
          <div class="ttl">${weekdayLabels[dates.indexOf(info.dt)]}曜日・${info.dt}</div>
          ${info.tx.map(t=>renderTxRow(t)).join("")}
        </div>
      `).join("");

  return `
    <div class="cal-head">
      <button class="nav-round" id="prevWeek">‹</button>
      <span class="ym">${rangeLabel}</span>
      <button class="nav-round" id="nextWeek">›</button>
    </div>
    <div class="grid" style="grid-template-columns:repeat(7,1fr);">${cellsHtml}</div>
    <div class="week-summary">
      <span>週の収入 ${yen(weekIncomeTotal)}</span>
      <span>週の支出 ${yen(weekExpenseTotal)}</span>
    </div>
    ${listHtml}
  `;
}

// ---------- REPORT ----------
function renderReport(){
  const year = state.cursorYear, month = state.cursorMonth;
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  const realMonthTx = state.transactions.filter(t=>t.date.startsWith(monthKey) && !t.isExample);
  const monthTx = realMonthTx.concat(fixedTxForMonth(year, month));

  const income = monthTx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = monthTx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;

  const byCat = state.categories.filter(c=>c.type==="expense").map(c=>{
    const sum = monthTx.filter(t=>t.type==="expense" && t.categoryId===c.id).reduce((s,t)=>s+t.amount,0);
    return {id:c.id, name:c.name, value:sum, color:c.color};
  }).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);

  const byCatIncome = state.categories.filter(c=>c.type==="income").map(c=>{
    const sum = monthTx.filter(t=>t.type==="income" && t.categoryId===c.id).reduce((s,t)=>s+t.amount,0);
    return {id:c.id, name:c.name, value:sum, color:c.color};
  }).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);

  function buildPieSvg(data){
    if(data.length===0) return "";
    const total = data.reduce((s,d)=>s+d.value,0);
    let angle = -90;
    const R=75, r=45, cx=100, cy=100;
    const arcs = data.map(d=>{
      const sweep = (d.value/total)*360;
      const startAngle = angle;
      const endAngle = angle + sweep;
      angle = endAngle;
      const toRad = a => (a*Math.PI)/180;
      const x1 = cx + R*Math.cos(toRad(startAngle)), y1 = cy + R*Math.sin(toRad(startAngle));
      const x2 = cx + R*Math.cos(toRad(endAngle)), y2 = cy + R*Math.sin(toRad(endAngle));
      const ix1 = cx + r*Math.cos(toRad(endAngle)), iy1 = cy + r*Math.sin(toRad(endAngle));
      const ix2 = cx + r*Math.cos(toRad(startAngle)), iy2 = cy + r*Math.sin(toRad(startAngle));
      const largeArc = sweep>180?1:0;
      return `<path d="M ${x1} ${y1} A ${R} ${R} 0 ${largeArc} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${r} ${r} 0 ${largeArc} 0 ${ix2} ${iy2} Z" fill="${d.color}" stroke="${TOKENS.paper}" stroke-width="2"/>`;
    }).join("");
    return `<svg width="200" height="200" viewBox="0 0 200 200">${arcs}</svg>`;
  }
  const pieSvg = buildPieSvg(byCat);
  const pieSvgIncome = buildPieSvg(byCatIncome);

  // 外食回数カウント
  const diningCatIds = state.categories.filter(c=>c.diningOutEnabled).map(c=>c.id);
  const diningOutCount = realMonthTx.filter(t=> diningCatIds.includes(t.categoryId) && t.diningOut===true).length;
  const bentoCount = realMonthTx.filter(t=> diningCatIds.includes(t.categoryId) && t.diningOut==="bento").length;
  const selfCookCount = realMonthTx.filter(t=> diningCatIds.includes(t.categoryId) && t.diningOut!==true && t.diningOut!=="bento").length;

  // 予算セクション（支出カテゴリのみ）
  const budgetCats = Object.keys(state.budgets).filter(cid=> state.budgets[cid] > 0 && state.categories.some(c=>c.id===cid && c.type==="expense"));
  const budgetRowsHtml = budgetCats.map(cid=>{
    const c = catOf(cid);
    const budget = state.budgets[cid];
    const spent = monthTx.filter(t=>t.type==="expense" && t.categoryId===cid).reduce((s,t)=>s+t.amount,0);
    const pct = Math.min((spent/budget)*100, 100);
    const over = spent > budget;
    return `
      <div class="budget-row">
        <div class="top">
          <span class="cat">${c.icon} ${c.name}</span>
          <span style="color:${over?TOKENS.bengara:'var(--ink60)'}">${yen(spent)} / ${yen(budget)}</span>
        </div>
        <div class="budget-bar-bg">
          <div class="budget-bar-fill" style="width:${pct}%; background:${over?TOKENS.bengara:c.color}"></div>
        </div>
      </div>
    `;
  }).join("");

  const totalBudget = budgetCats.reduce((s,cid)=>s+state.budgets[cid],0);
  const budgetedSpent = budgetCats.reduce((s,cid)=>s+monthTx.filter(t=>t.type==="expense"&&t.categoryId===cid).reduce((a,t)=>a+t.amount,0),0);
  const unbudgetedSpent = expense - budgetedSpent;

  // 烙印（振り返りスタンプ）の集計（月間／年間切替）
  const stampPeriodKey = state.stampReportView === "year" ? `${year}-` : monthKey;
  const stampRowsHtml = state.stamps.map(s=>{
    const matched = state.transactions.filter(t=> (t.stamps||[]).includes(s.id) && t.date.startsWith(stampPeriodKey) && !t.isExample);
    const totalAmt = matched.reduce((sum,t)=>sum + t.amount, 0);
    const isOpen = state.expandedStampId === s.id;
    const detailHtml = isOpen ? matched
      .slice()
      .sort((a,b)=> a.date < b.date ? 1 : -1)
      .map(t=>{
        const c = catOf(t.categoryId);
        return `
          <div class="stamp-detail-item">
            <span class="d">${t.date}</span>
            <span class="c">${c.icon} ${t.comment ? t.comment.slice(0,20) + (t.comment.length>20?'…':'') : c.name}</span>
            <span class="a">${yen(t.amount)}</span>
          </div>
        `;
      }).join("") : "";
    return `
      <div class="stamp-report-row" data-stamp-expand="${s.id}">
        <span class="icon">${s.icon}</span>
        <span class="nm">${s.name}</span>
        <span class="cnt-amt">
          <span class="amt-total">${yen(totalAmt)}</span>
          <span class="cnt">${matched.length}件</span>
        </span>
        <span class="chev ${isOpen?'open':''}">▶</span>
      </div>
      ${detailHtml}
    `;
  }).join("");

  return `
    <div class="pad report-neu" style="padding-left:0;padding-right:0;">
      <div style="padding:0 16px;">
        <div class="cal-head">
          <button class="nav-round" id="prevMonthR">‹</button>
          <span class="ym">${year}年 ${month+1}月</span>
          <button class="nav-round" id="nextMonthR">›</button>
        </div>
        <div class="report-summary">
          <div class="col">
            <div class="lbl">収入</div>
            <div class="val" style="color:${TOKENS.moss}">${yen(income)}</div>
          </div>
          <div class="col center">
            <div class="lbl">収支</div>
            <div class="val balance" style="color:${balance>=0?TOKENS.moss:TOKENS.bengara}">${balance>=0?'+':''}${yen(balance)}</div>
          </div>
          <div class="col right">
            <div class="lbl">支出</div>
            <div class="val" style="color:${TOKENS.bengara}">${yen(expense)}</div>
          </div>
        </div>
        ${(state.showDiningStat && diningCatIds.length>0) ? `
        <div class="dining-stat">
          <div>
            <div class="main">🍽 外食回数：${diningOutCount}回</div>
            <div class="sub">自炊：${selfCookCount}回${state.showBentoOption ? `　弁当：${bentoCount}回` : ''}</div>
          </div>
        </div>` : ''}
      </div>
      <div class="report-title collapsible" data-toggle-catsection>
        <span>カテゴリ別内訳（支出／収入）</span>
        <span class="chev ${state.reportCatOpen?'open':''}">▶</span>
      </div>
      ${state.reportCatOpen ? `
        <div class="cat-swipe-wrap">
          <div class="cat-swipe-track" id="catSwipeTrack" style="transform:translateX(${state.reportCatView==='expense'?'0%':'-50%'})">
            <div class="cat-slide">
              <div class="report-title">カテゴリ別支出</div>
              ${byCat.length===0 ? `<div class="empty">データなし</div>` : `
                <div class="pie-wrap">${pieSvg}</div>
                <div class="legend">
                  ${byCat.map(d=>`
                    <div class="legend-row">
                      <span class="dot" style="background:${d.color}"></span>
                      <span class="name">${d.name}</span>
                      <span class="val">${yen(d.value)}</span>
                    </div>
                  `).join("")}
                </div>
              `}
            </div>
            <div class="cat-slide">
              <div class="report-title">カテゴリ別収入</div>
              ${byCatIncome.length===0 ? `<div class="empty">データなし</div>` : `
                <div class="pie-wrap">${pieSvgIncome}</div>
                <div class="legend">
                  ${byCatIncome.map(d=>`
                    <div class="legend-row">
                      <span class="dot" style="background:${d.color}"></span>
                      <span class="name">${d.name}</span>
                      <span class="val">${yen(d.value)}</span>
                    </div>
                  `).join("")}
                </div>
              `}
            </div>
          </div>
        </div>
        <div class="cat-dots">
          <button class="dot ${state.reportCatView==='expense'?'active':''}" data-catview="expense"></button>
          <button class="dot ${state.reportCatView==='income'?'active':''}" data-catview="income"></button>
          <span class="hint">スワイプで支出／収入を切替</span>
        </div>
      ` : ''}

      <div class="report-title">予算の消化状況</div>
      ${budgetCats.length===0 ? `<div class="empty">設定タブから予算を登録できます</div>` : `
        <div class="budget-section">
          ${budgetRowsHtml}
          <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink60); display:flex; justify-content:space-between;">
            <span>予算合計 ${yen(totalBudget)}</span>
            <span>${state.excludeUnbudgeted ? '予算外の支出 ' + yen(unbudgetedSpent) + '（合計に含めない）' : ''}</span>
          </div>
        </div>
      `}

      <div class="report-title" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>振り返りスタンプ（${state.stampReportView==='year' ? year+'年' : year+'年'+(month+1)+'月'}）</span>
        <div class="stamp-period-toggle">
          <button data-stampview="month" class="${state.stampReportView!=='year'?'active':''}">月間</button>
          <button data-stampview="year" class="${state.stampReportView==='year'?'active':''}">年間</button>
        </div>
      </div>
      ${state.stamps.length===0 ? `<div class="empty">思い出タブの「烙印モード」、または設定タブから烙印を追加できます</div>` : `
        <div style="border-top:1px solid var(--line); margin-bottom:8px;">
          ${stampRowsHtml}
        </div>
      `}
    </div>
  `;
}

// ---------- MEMORY ----------
function renderMemory(){
  let periodMemory, navHtml;

  if(state.memoryView === "week"){
    if(!state.memoryWeekAnchor) state.memoryWeekAnchor = fmtDate(startOfWeek(TODAY));
    const anchor = new Date(state.memoryWeekAnchor+'T00:00:00');
    const weekDates = Array.from({length:7},(_,i)=>{ const d=new Date(anchor); d.setDate(anchor.getDate()+i); return fmtDate(d); });
    periodMemory = state.transactions.filter(t=> weekDates.includes(t.date));
    const rangeLabel = `${weekDates[0].slice(5).replace('-','/')} 〜 ${weekDates[6].slice(5).replace('-','/')}`;
    navHtml = `
      <div class="memory-month-nav">
        <button class="nav-round" id="prevWeekM">‹</button>
        <span class="ym">${rangeLabel}の思い出</span>
        <button class="nav-round" id="nextWeekM">›</button>
      </div>
    `;
  } else {
    const monthKey = `${state.memoryYear}-${String(state.memoryMonth+1).padStart(2,'0')}`;
    periodMemory = state.transactions.filter(t=> t.date.startsWith(monthKey));
    navHtml = `
      <div class="memory-month-nav">
        <button class="nav-round" id="prevMonthM">‹</button>
        <span class="ym">${state.memoryYear}年 ${state.memoryMonth+1}月の思い出</span>
        <button class="nav-round" id="nextMonthM">›</button>
      </div>
    `;
  }

  const viewSwitchHtml = `
    <div class="switch" style="margin:0 16px 10px;">
      <button data-memview="month" class="${state.memoryView!=='week'?'active':''}">月</button>
      <button data-memview="week" class="${state.memoryView==='week'?'active':''}">週</button>
    </div>
  `;

  const usedCatIds = [...new Set(periodMemory.map(t=>t.categoryId))];
  const usedCats = state.categories.filter(c=>usedCatIds.includes(c.id));

  const sorted = periodMemory
    .slice()
    .sort((a,b)=> a.date < b.date ? 1 : -1)
    .filter(t=> state.memoryFilter==="all" || t.categoryId===state.memoryFilter);

  const monthNavHtml = navHtml;

  const reflectBarHtml = `
    <div class="reflect-bar">
      <span style="font-size:11px; color:var(--ink60);">${state.reflectionMode ? '投稿をタップして烙印を押せます' : ''}</span>
      <button class="reflect-toggle ${state.reflectionMode?'on':''}" id="reflectToggleBtn">
        ${state.reflectionMode ? '✕ 烙印モードを終了' : '🔎 烙印モード'}
      </button>
    </div>
  `;

  let stampBarHtml = "";
  if(state.reflectionMode){
    stampBarHtml = `
      <div class="stamp-pill-row">
        ${state.stamps.map(s=>`
          <button class="stamp-pill ${state.activeStampId===s.id?'active':''}" data-stamp="${s.id}" style="${state.activeStampId===s.id?`border-color:${s.color};background:${s.color};`:''}">${s.icon} ${s.name}</button>
        `).join("")}
        <button class="stamp-quick-add-btn" id="stampQuickAddToggle">＋ 新しい焼印</button>
      </div>
      ${state.stampQuickAddOpen ? `
        <div class="stamp-quick-add-form">
          <input type="text" id="quickStampName" placeholder="例）Unforgettable、子供のため、等々" value="${state.newStampName}" />
          <button id="quickStampAddBtn">追加</button>
        </div>
      ` : ''}
      ${state.stamps.length>0 ? `<div class="stamp-hint">「${state.stamps.find(s=>s.id===state.activeStampId)?.name || '烙印'}」を選択中 — 投稿をタップして押す／外す</div>` : `<div class="stamp-hint">焼印を追加してから、投稿をタップして押しましょう</div>`}
    `;
  }

  const filterHtml = `
    <div class="filter-row">
      <button class="pill ${state.memoryFilter==='all'?'active':''}" data-filter="all">すべて</button>
      ${usedCats.map(c=>`<button class="pill ${state.memoryFilter===c.id?'active':''}" data-filter="${c.id}">${c.icon} ${c.name}</button>`).join("")}
    </div>
  `;

  const cardsHtml = sorted.length===0
    ? `<div class="empty">この期間にはまだ思い出がありません</div>`
    : sorted.map((t,i)=>{
        const c = catOf(t.categoryId);
        const rotate = i%2===0 ? -1.2 : 1.4;

        if(!state.reflectionMode && state.editingMemoryId === t.id){
          const catsOfType = state.categories.filter(cc=>cc.type===t.type);
          const draft = state.editingDraft;
          const editTxStamps = (t.stamps || []).map(sid=>state.stamps.find(s=>s.id===sid)).filter(Boolean);
          return `
            <div class="memory-card editing">
              ${editTxStamps.length>0 ? `
                <div class="edit-stamps-row">
                  <span class="lbl-mini">押された焼印：</span>
                  ${editTxStamps.map(s=>`<span class="edit-stamp-chip" data-remove-edit-stamp="${s.id}">${s.name} ✕</span>`).join("")}
                </div>
              ` : ''}
              <div class="edit-field-row">
                <select data-edit-cat>
                  ${catsOfType.map(cc=>`<option value="${cc.id}" ${draft.categoryId===cc.id?'selected':''}>${cc.icon} ${cc.name}</option>`).join("")}
                </select>
                <input type="number" min="0" data-edit-amount value="${draft.amount}" />
              </div>
              <div class="edit-photo-row">
                <input type="file" accept="image/*" id="editPhotoInput" style="display:none" />
                ${draft.photo
                  ? `<img src="${draft.photo}" /><button class="edit-photo-btn" data-edit-photo-remove>写真を削除</button>`
                  : `<button class="edit-photo-btn" data-edit-photo-add>写真を追加</button>`
                }
              </div>
              <textarea class="edit-comment" data-edit-comment placeholder="例：店の名前、一言思い出。">${draft.comment}</textarea>
              <div class="edit-actions">
                <button class="btn-save" data-save-memory>保存</button>
                <button class="btn-delete" data-delete-memory>削除</button>
                <button class="btn-cancel" data-cancel-memory>キャンセル</button>
              </div>
            </div>
          `;
        }

        const txStamps = (t.stamps || []).map(sid=>state.stamps.find(s=>s.id===sid)).filter(Boolean);
        const hasActiveStamp = state.reflectionMode && state.activeStampId && (t.stamps||[]).includes(state.activeStampId);
        const clickAttr = state.reflectionMode ? `data-stamp-toggle="${t.id}"` : `data-open-memory="${t.id}"`;

        const stampBadgesHtml = txStamps.map((s,si)=>{
          const group = Math.floor(si/2);
          const dir = si%2===0 ? 1 : -1;
          const offX = dir * (26 + group*36);
          const offY = group * 8;
          const rot = si%2===0 ? -6 : 5;
          return `<div class="yakiin-stamp" style="left:calc(50% + ${offX}px); top:calc(56% + ${offY}px); transform:translate(-50%,-50%) rotate(${rot}deg); z-index:${6+si};">${s.name}</div>`;
        }).join("");

        return `
          <div class="memory-card ${state.reflectionMode?'stamp-mode':''} ${hasActiveStamp?'stamped-active':''}" style="transform:rotate(${rotate}deg)" ${clickAttr}>
            ${stampBadgesHtml}
            <div class="top">
              <span class="badge" style="background:${c.color}">${c.icon} ${c.name}</span>
              <span class="date">${t.date}</span>
              <span class="amt" style="color:${t.type==='income'?TOKENS.moss:TOKENS.bengara}">${t.type==='income'?'+':'-'}${yen(t.amount)}</span>
            </div>
            ${t.photo ? `<img src="${t.photo}" />` : ''}
            <div class="cmt ${t.comment?'':'cmt-empty'}">${t.comment || '例：店の名前、一言思い出。'}</div>
          </div>
        `;
      }).join("");

  return `<div class="memory-neu">${monthNavHtml}${viewSwitchHtml}${reflectBarHtml}${stampBarHtml}${filterHtml}<div class="memories">${cardsHtml}</div></div>`;
}

// ---------- SETTINGS ----------
function renderSettings(){
  const sub = `
    <div class="settings-sub">
      <button data-sub="budget" class="${state.settingsSubTab==='budget'?'active':''}">予算</button>
      <button data-sub="fixed" class="${state.settingsSubTab==='fixed'?'active':''}">固定費</button>
      <button data-sub="category" class="${state.settingsSubTab==='category'?'active':''}">カテゴリ</button>
      <button data-sub="display" class="${state.settingsSubTab==='display'?'active':''}">表示</button>
      <button data-sub="stamps" class="${state.settingsSubTab==='stamps'?'active':''}">烙印</button>
      <button data-sub="account" class="${state.settingsSubTab==='account'?'active':''}">アカウント</button>
      <button data-sub="data" class="${state.settingsSubTab==='data'?'active':''}">データ</button>
    </div>
  `;

  if(state.settingsSubTab === "data"){
    const monthKeyForCsv = `${state.csvYear}-${String(state.csvMonth+1).padStart(2,'0')}`;
    const txCountInRange = state.csvPeriodMode==="month"
      ? state.transactions.filter(t=>t.date.startsWith(monthKeyForCsv)).length
      : state.transactions.length;
    return `
      ${sub}
      <div style="padding:16px;">
        <div class="report-title" style="padding:0; margin-bottom:8px;">記録をCSVで書き出す</div>
        <p style="font-size:12px; color:var(--ink60); line-height:1.7; margin:0 0 16px;">
          日付・カテゴリ・金額を含むCSVファイルとして書き出せます。表計算ソフト（Excel等）で開いたり、バックアップとして保存したりできます。
        </p>

        <div style="font-size:12px; color:var(--ink60); margin-bottom:8px;">書き出す範囲：</div>
        <div class="switch" style="margin-bottom:${state.csvPeriodMode==='month'?'10px':'16px'};">
          <button data-csvperiod="all" class="${state.csvPeriodMode!=='month'?'active':''}">全期間</button>
          <button data-csvperiod="month" class="${state.csvPeriodMode==='month'?'active':''}">月を指定</button>
        </div>
        ${state.csvPeriodMode==='month' ? `
          <div class="cal-head" style="margin-bottom:16px;">
            <button class="nav-round" id="csvPrevMonth">‹</button>
            <span class="ym" style="font-size:15px;">${state.csvYear}年 ${state.csvMonth+1}月</span>
            <button class="nav-round" id="csvNextMonth">›</button>
          </div>
        ` : ''}
        <div style="font-size:11.5px; color:var(--ink60); margin:-6px 0 16px;">対象：${txCountInRange}件</div>

        <div style="font-size:12px; color:var(--ink60); margin-bottom:8px;">含める項目を選択：</div>
        <label class="exclude-toggle" style="padding:8px 0;">
          <input type="checkbox" id="csvIncludeDining" ${state.csvIncludeDining?'checked':''} />
          <span>外食／自炊</span>
        </label>
        <label class="exclude-toggle" style="padding:8px 0;">
          <input type="checkbox" id="csvIncludeComment" ${state.csvIncludeComment?'checked':''} />
          <span>コメント</span>
        </label>
        <label class="exclude-toggle" style="padding:8px 0;">
          <input type="checkbox" id="csvIncludeStamps" ${state.csvIncludeStamps?'checked':''} />
          <span>押された烙印</span>
        </label>
        <label class="exclude-toggle" style="padding:8px 0 16px;">
          <input type="checkbox" id="csvIncludeFixed" ${state.csvIncludeFixed?'checked':''} />
          <span>固定費かどうか</span>
        </label>
        <button class="add-btn" id="exportCsvBtn">CSVをダウンロード</button>
      </div>
    `;
  }

  if(state.settingsSubTab === "account"){
    if(!state.authUser){
      return `
        ${sub}
        <div style="padding:16px;">
          <p style="font-size:12px; color:var(--ink60); line-height:1.7; margin:0 0 16px;">
            現在はログインなしで、この端末だけにデータを保存しています。ログインすると、記録をクラウドに保存し、他の端末とも同期できるようになります。
          </p>
          <button class="auth-google-btn" id="settingsGoogleSignInBtn">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.1-7.9 19.1-19.6 0-1.3-.1-2.6-.3-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16 4 9.1 8.6 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.2-1.9 13.9-5.1l-6.4-5.4C29.6 35.4 26.9 36.4 24 36.4c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9 39.3 15.9 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.4 5.4C40.4 36.5 44 30.9 44 24c0-1.3-.1-2.6-.4-3.5z"/></svg>
            <span>Googleでログイン</span>
          </button>
        </div>
      `;
    }
    return `
      ${sub}
      <div class="account-row">
        <span class="email">${state.authUser ? state.authUser.email : ''}</span>
      </div>
      <button class="account-btn logout" id="logoutBtn">ログアウト</button>
      ${state.accountDeleteConfirm ? `
        <div class="cat-delete-confirm" style="margin:0 16px 14px;">
          <p>アカウントを削除しますか？<br>クラウド上の記録データも削除され、元に戻せません。</p>
          <div class="row">
            <button class="btn-confirm" id="accountDeleteConfirmBtn">削除する</button>
            <button class="btn-cancel" id="accountDeleteCancelBtn">キャンセル</button>
          </div>
        </div>
      ` : `
        <button class="account-btn delete" id="accountDeleteBtn">アカウントを削除</button>
      `}
    `;
  }

  if(state.settingsSubTab === "budget"){
    const rows = state.categories.filter(c=>c.type==="expense").map(c=>`
      <div class="budget-edit-row">
        <span class="catlabel">${c.icon} ${c.name}</span>
        <input type="number" min="0" step="100" placeholder="未設定" value="${state.budgets[c.id] ?? ''}" data-budget-cat="${c.id}" />
      </div>
    `).join("");
    return `
      ${sub}
      ${rows}
      <label class="exclude-toggle">
        <input type="checkbox" id="excludeToggle" ${state.excludeUnbudgeted ? 'checked' : ''} />
        <span>予算未設定のカテゴリーの支出を、予算合計の消化状況に含めない</span>
      </label>
    `;
  }

  if(state.settingsSubTab === "fixed"){
    const catsForFcType = state.categories.filter(c=>c.type===state.fcType);
    const listHtml = state.fixedCosts.length === 0
      ? `<div class="empty">固定費はまだ登録されていません</div>`
      : state.fixedCosts.map(fc=>{
          const c = catOf(fc.categoryId);
          return `
            <div class="fixed-item">
              <div class="info">
                <div class="name">${c.icon} ${c.name} ${fc.memo ? '・' + fc.memo : ''}</div>
                <div class="meta">毎月${fc.day}日${fc.endDate ? ' 〜 ' + fc.endDate + 'まで' : ''}</div>
              </div>
              <span class="amt" style="color:${fc.type==='income'?TOKENS.moss:TOKENS.bengara}">${fc.type==='income'?'+':'-'}${yen(fc.amount)}</span>
              <button class="del-btn" data-del-fixed="${fc.id}">✕</button>
            </div>
          `;
        }).join("");

    return `
      ${sub}
      <div class="fixed-form">
        <div class="row">
          <div class="field">
            <label>種別</label>
            <select id="fcType">
              <option value="expense" ${state.fcType==='expense'?'selected':''}>支出</option>
              <option value="income" ${state.fcType==='income'?'selected':''}>収入</option>
            </select>
          </div>
          <div class="field">
            <label>カテゴリ</label>
            <select id="fcCat">
              ${catsForFcType.map(c=>`<option value="${c.id}" ${state.fcCat===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>金額（円）</label>
            <input type="number" min="0" id="fcAmount" placeholder="例）68000" value="${state.fcAmount}" />
          </div>
          <div class="field">
            <label>毎月の日にち</label>
            <select id="fcDay">
              ${Array.from({length:28},(_,i)=>i+1).map(d=>`<option value="${d}" ${Number(state.fcDay)===d?'selected':''}>${d}日</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>終了日（任意）</label>
            <input type="date" id="fcEndDate" value="${state.fcEndDate}" />
          </div>
        </div>
        <button class="add-btn" id="addFixedBtn">固定費を追加</button>
      </div>
      <div class="fixed-list">${listHtml}</div>
    `;
  }

  if(state.settingsSubTab === "display"){
    return `
      ${sub}
      <label class="exclude-toggle">
        <input type="checkbox" id="showDiningToggle" ${state.showDiningStat ? 'checked' : ''} />
        <span>外食回数カウントを表示する（レポートの表示・入力時の外食/自炊の選択、両方に反映されます）</span>
      </label>
      <label class="exclude-toggle">
        <input type="checkbox" id="showBentoToggle" ${state.showBentoOption ? 'checked' : ''} />
        <span>「弁当」の選択肢を追加する（外食／自炊に加えて選べるようになります）</span>
      </label>
    `;
  }

  if(state.settingsSubTab === "stamps"){
    const stampListHtml = state.stamps.length===0
      ? `<div class="empty">まだ烙印がありません</div>`
      : state.stamps.map(s=>`
          <div class="cat-list-item">
            <span class="swatch" style="background:${s.color}"></span>
            <span class="nm">${s.icon} ${s.name}</span>
            <button class="del-btn" data-del-stamp="${s.id}">✕</button>
          </div>
        `).join("");

    return `
      ${sub}
      <div class="cat-list">${stampListHtml}</div>
      <div class="cat-add-form">
        <div class="report-title" style="padding:0; margin-bottom:10px;">新しい烙印を追加</div>
        <div class="row">
          <input type="text" class="icon-input" id="newStampIcon" maxlength="2" value="${state.newStampIcon}" />
          <input type="text" class="name-input" id="newStampName" placeholder="例）Unforgettable、子供のため、等々" value="${state.newStampName}" />
        </div>
        <div class="swatches">
          ${COLOR_PRESETS.map(col=>`<button class="swatch-btn ${state.newStampColor===col?'selected':''}" data-stampswatch="${col}" style="background:${col}"></button>`).join("")}
        </div>
        <button class="add-btn" id="addStampBtn">烙印を追加</button>
      </div>
    `;
  }

  // カテゴリ管理タブ
  const catListHtml = state.categories.map(c=>{
    const isSelected = state.catSelectedIds.includes(c.id);
    const clickAttr = state.catSelectMode ? `data-cat-select="${c.id}"` : "";
    const sameType = state.categories.filter(cc=>cc.type===c.type);
    const posInType = sameType.findIndex(cc=>cc.id===c.id);

    if(state.editingCatId === c.id){
      return `
      <div class="cat-list-item editing-cat" data-cat-id="${c.id}" data-cat-type="${c.type}">
        <input type="text" class="cat-edit-icon" id="catEditIcon" maxlength="2" value="${state.editCatIcon}" />
        <input type="text" class="cat-edit-name" id="catEditName" value="${state.editCatName}" />
        <button class="cat-edit-save" data-cat-save="${c.id}">保存</button>
        <button class="cat-edit-cancel" data-cat-cancel="${c.id}">✕</button>
      </div>
    `;
    }

    return `
    <div class="cat-list-item ${state.catSelectMode?'selectable':''} ${isSelected?'selected':''}" ${clickAttr} data-cat-id="${c.id}" data-cat-type="${c.type}">
      ${state.catSelectMode ? `<span class="cat-checkbox ${isSelected?'checked':''}">${isSelected?'✓':''}</span>` : ''}
      <span class="swatch" style="background:${c.color}"></span>
      <span class="nm" ${!state.catSelectMode ? `data-cat-edit-open="${c.id}"` : ''}>${c.icon} ${c.name}
        <span class="type-tag ${c.type}">${c.type==='income'?'収入':'支出'}</span>
        ${c.diningOutEnabled ? '<span class="dine-tag">外食チェック</span>' : ''}
      </span>
      ${!state.catSelectMode ? `
        <span class="cat-drag-handle" data-cat-drag="${c.id}">⠿</span>
      ` : ''}
    </div>
  `;
  }).join("");


  const selectBarHtml = `
    <div class="cat-select-bar">
      <button class="cat-select-toggle ${state.catSelectMode?'on':''}" id="catSelectModeToggle">${state.catSelectMode ? 'キャンセル' : '選択して削除'}</button>
      ${state.catSelectMode ? `<button class="cat-delete-selected-btn" id="catDeleteSelectedBtn" ${state.catSelectedIds.length===0?'disabled':''}>${state.catSelectedIds.length}件を削除</button>` : ''}
    </div>
  `;

  const confirmHtml = state.catDeleteConfirm ? `
    <div class="cat-delete-confirm">
      <p>選択した${state.catSelectedIds.length}件のジャンルを削除しますか？<br>関連する記録・固定費は「その他」に振り替わります。</p>
      <div class="row">
        <button class="btn-confirm" id="catDeleteConfirmBtn">削除する</button>
        <button class="btn-cancel" id="catDeleteCancelBtn">キャンセル</button>
      </div>
    </div>
  ` : "";

  return `
    ${sub}
    ${selectBarHtml}
    ${confirmHtml}
    <div class="cat-list">${catListHtml}</div>
    <div class="cat-add-form">
      <div class="report-title" style="padding:0; margin-bottom:10px;">新しいカテゴリを追加</div>
      <div class="switch" style="margin-bottom:10px;">
        <button data-newcattype="expense" class="${state.newCatType==='expense'?'active':''}">支出</button>
        <button data-newcattype="income" class="${state.newCatType==='income'?'active':''}">収入</button>
      </div>
      <div class="row">
        <input type="text" class="icon-input" id="newCatIcon" maxlength="2" value="${state.newCatIcon}" />
        <input type="text" class="name-input" id="newCatName" placeholder="カテゴリ名" value="${state.newCatName}" />
      </div>
      <div class="swatches">
        ${COLOR_PRESETS.map(col=>`<button class="swatch-btn ${state.newCatColor===col?'selected':''}" data-swatch="${col}" style="background:${col}"></button>`).join("")}
      </div>
      <label class="dine-check">
        <input type="checkbox" id="newCatDining" ${state.newCatDining?'checked':''} />
        <span>選択時に「外食 / 自炊」を選べるようにする（食費用の項目に）</span>
      </label>
      <button class="add-btn" id="addCatBtn">カテゴリを追加</button>
    </div>
  `;
}

// ---------- Handlers ----------
function attachHandlers(){
  if(state.tab==="input"){
    document.querySelectorAll(".switch button").forEach(b=>{
      b.onclick = ()=>{
        state.inputType = b.dataset.type;
        const firstOfType = state.categories.find(c=>c.type===state.inputType);
        state.inputCat = firstOfType ? firstOfType.id : state.inputCat;
        state.inputDiningOut = null;
        state.catQuickAddOpen = false;
        render();
      };
    });
    document.querySelectorAll(".cat-btn").forEach(b=>{
      b.onclick = ()=>{
        state.inputCat = b.dataset.cat;
        state.inputDiningOut = null;
        state.catQuickAddOpen = (b.dataset.cat === "other" || b.dataset.cat === "other_income");
        render();
      };
    });

    const quickCatIcon = document.getElementById("quickCatIcon");
    const quickCatName = document.getElementById("quickCatName");
    if(quickCatIcon) quickCatIcon.oninput = (e)=>{ state.newCatIcon = e.target.value; };
    if(quickCatName) quickCatName.oninput = (e)=>{ state.newCatName = e.target.value; };
    document.querySelectorAll("[data-quickcatswatch]").forEach(b=>{
      b.onclick = ()=>{ state.newCatColor = b.dataset.quickcatswatch; render(); };
    });
    const quickCatAddBtn = document.getElementById("quickCatAddBtn");
    if(quickCatAddBtn){
      quickCatAddBtn.onclick = ()=>{
        const name = (state.newCatName || "").trim();
        if(!name) return;
        const newCat = {
          id: uid("cat"),
          name,
          icon: state.newCatIcon || "🏷️",
          color: state.newCatColor,
          type: state.inputType,
          diningOutEnabled: false
        };
        state.categories.push(newCat);
        state.inputCat = newCat.id;
        state.newCatName = "";
        state.newCatIcon = "🏷️";
        state.catQuickAddOpen = false;
        render();
      };
    }

    document.querySelectorAll(".dining-row button").forEach(b=>{
      b.onclick = ()=>{
        const v = b.dataset.dine === "bento" ? "bento" : true;
        state.inputDiningOut = state.inputDiningOut === v ? null : v;
        render();
      };
    });
    const calcToggleBtn = document.getElementById("calcToggleBtn");
    if(calcToggleBtn){
      calcToggleBtn.onclick = ()=>{ state.calcOpen = true; state.datePickerOpen = false; render(); };
    }
    const amountBoxTap = document.getElementById("amountBoxTap");
    if(amountBoxTap){
      amountBoxTap.onclick = ()=>{ state.calcOpen = true; state.datePickerOpen = false; render(); };
    }
    document.querySelectorAll(".keypad button").forEach(b=>{
      b.onclick = ()=>{
        const k = b.dataset.key;
        if(k==="del"){ state.inputAmount = state.inputAmount.slice(0,-1); }
        else if(state.inputAmount.length < 9){
          state.inputAmount = state.inputAmount==="0" ? k : state.inputAmount + k;
        }
        render();
      };
    });
    document.querySelectorAll("[data-daterel]").forEach(b=>{
      b.onclick = ()=>{
        const rel = b.dataset.daterel;
        if(rel === "today") state.inputDate = TODAY;
        else if(rel === "yesterday") state.inputDate = addDays(TODAY, -1);
        else if(rel === "daybefore") state.inputDate = addDays(TODAY, -2);
        render();
      };
    });
    const dateCustomChip = document.getElementById("dateCustomChip");
    if(dateCustomChip){
      dateCustomChip.onclick = ()=>{
        const p = state.inputDate.split("-");
        state.datePickerYear = Number(p[0]);
        state.datePickerMonth = Number(p[1]);
        state.datePickerDay = Number(p[2]);
        state.calcOpen = false;
        state.datePickerOpen = true;
        render();
      };
    }
    const commentInput = document.getElementById("commentInput");
    if(commentInput){
      commentInput.oninput = (e)=>{ state.inputComment = e.target.value; };
    }

    const receiptBtn = document.getElementById("receiptBtn");
    const receiptInput = document.getElementById("receiptInput");
    if(receiptBtn && !state.receiptLoading){
      receiptBtn.onclick = ()=> receiptInput.click();
    }
    if(receiptInput){
      receiptInput.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{
          const dataUrl = ev.target.result;
          state.receiptLoading = true;
          render();
          // オンデバイスOCRでの読み取り処理を模した簡易シミュレーション
          setTimeout(()=>{
            const guessedAmount = Math.floor((300 + Math.random()*2700) / 10) * 10;
            state.inputType = "expense";
            state.inputPhoto = dataUrl;
            state.inputAmount = String(guessedAmount);
            if(!state.categories.some(c=>c.id===state.inputCat && c.type==='expense')){
              state.inputCat = (state.categories.find(c=>c.id==='food' && c.type==='expense') || state.categories.find(c=>c.type==='expense')).id;
            }
            state.receiptLoading = false;
            render();
          }, 1100);
        };
        reader.readAsDataURL(file);
      };
    }

    const photoSlot = document.getElementById("photoSlot");
    const photoInput = document.getElementById("photoInput");
    if(photoSlot && !state.inputPhoto){
      photoSlot.onclick = ()=> photoInput.click();
    }
    if(photoInput){
      photoInput.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{ state.inputPhoto = ev.target.result; render(); };
        reader.readAsDataURL(file);
      };
    }
    const removePhoto = document.getElementById("removePhoto");
    if(removePhoto){
      removePhoto.onclick = (e)=>{ e.stopPropagation(); state.inputPhoto = null; render(); };
    }
    const saveBtn = document.getElementById("saveBtn");
    if(saveBtn){
      saveBtn.onclick = ()=>{
        if(!state.inputAmount) return;
        state.transactions.unshift({
          id: uid(),
          date: state.inputDate || TODAY,
          type: state.inputType,
          categoryId: state.inputCat,
          amount: Number(state.inputAmount),
          comment: state.inputComment,
          photo: state.inputPhoto,
          diningOut: state.inputDiningOut,
          stamps: []
        });
        state.inputAmount = "";
        state.inputComment = "";
        state.inputPhoto = null;
        state.inputDiningOut = null;
        state.calcOpen = false;
        state.catQuickAddOpen = false;
        state.saved = true;
        render();
        setTimeout(()=>{ state.saved = false; render(); }, 1200);
      };
    }
  }

  if(state.tab==="calendar"){
    document.querySelectorAll("[data-calview]").forEach(b=>{
      b.onclick = ()=>{ state.calendarView = b.dataset.calview; state.selectedDay = null; render(); };
    });
    const prev = document.getElementById("prevMonth");
    const next = document.getElementById("nextMonth");
    if(prev) prev.onclick = ()=>{
      state.cursorMonth--; if(state.cursorMonth<0){state.cursorMonth=11; state.cursorYear--;}
      state.selectedDay=null; render();
    };
    if(next) next.onclick = ()=>{
      state.cursorMonth++; if(state.cursorMonth>11){state.cursorMonth=0; state.cursorYear++;}
      state.selectedDay=null; render();
    };
    const prevWeek = document.getElementById("prevWeek");
    const nextWeek = document.getElementById("nextWeek");
    if(prevWeek) prevWeek.onclick = ()=>{
      const d = new Date(state.weekAnchor+'T00:00:00'); d.setDate(d.getDate()-7);
      state.weekAnchor = fmtDate(d); state.selectedDay=null; render();
    };
    if(nextWeek) nextWeek.onclick = ()=>{
      const d = new Date(state.weekAnchor+'T00:00:00'); d.setDate(d.getDate()+7);
      state.weekAnchor = fmtDate(d); state.selectedDay=null; render();
    };
    document.querySelectorAll(".day-cell").forEach(b=>{
      b.onclick = ()=>{
        const key = b.dataset.day;
        state.selectedDay = state.selectedDay===key ? null : key;
        render();
      };
    });
  }

  if(state.tab==="report"){
    const prev = document.getElementById("prevMonthR");
    const next = document.getElementById("nextMonthR");
    if(prev) prev.onclick = ()=>{
      state.cursorMonth--; if(state.cursorMonth<0){state.cursorMonth=11; state.cursorYear--;}
      render();
    };
    if(next) next.onclick = ()=>{
      state.cursorMonth++; if(state.cursorMonth>11){state.cursorMonth=0; state.cursorYear++;}
      render();
    };

    const toggleCatSection = document.querySelector("[data-toggle-catsection]");
    if(toggleCatSection){
      toggleCatSection.onclick = ()=>{ state.reportCatOpen = !state.reportCatOpen; render(); };
    }

    document.querySelectorAll("[data-catview]").forEach(b=>{
      b.onclick = ()=>{ state.reportCatView = b.dataset.catview; render(); };
    });

    document.querySelectorAll("[data-stampview]").forEach(b=>{
      b.onclick = ()=>{ state.stampReportView = b.dataset.stampview; state.expandedStampId = null; render(); };
    });

    document.querySelectorAll("[data-stamp-expand]").forEach(row=>{
      row.onclick = ()=>{
        const id = row.dataset.stampExpand;
        state.expandedStampId = state.expandedStampId === id ? null : id;
        render();
      };
    });

    const track = document.getElementById("catSwipeTrack");
    if(track){
      let startX = null, dx = 0, dragging = false;
      const onDown = (x)=>{ startX = x; dx = 0; dragging = true; track.style.transition = "none"; };
      const onMove = (x)=>{
        if(!dragging) return;
        dx = x - startX;
        const base = state.reportCatView==='expense' ? 0 : -50;
        const pct = base + (dx / track.clientWidth) * 100;
        track.style.transform = `translateX(${pct}%)`;
      };
      const onUp = ()=>{
        if(!dragging) return;
        dragging = false;
        track.style.transition = "transform .3s ease";
        if(dx < -40 && state.reportCatView === "expense"){ state.reportCatView = "income"; }
        else if(dx > 40 && state.reportCatView === "income"){ state.reportCatView = "expense"; }
        render();
      };
      track.addEventListener("pointerdown", (e)=>{ onDown(e.clientX); track.setPointerCapture(e.pointerId); });
      track.addEventListener("pointermove", (e)=>{ if(dragging) onMove(e.clientX); });
      track.addEventListener("pointerup", onUp);
      track.addEventListener("pointercancel", onUp);
    }
  }

  if(state.tab==="memory"){
    document.querySelectorAll(".pill").forEach(b=>{
      b.onclick = ()=>{ state.memoryFilter = b.dataset.filter; state.editingMemoryId = null; render(); };
    });
    const prevM = document.getElementById("prevMonthM");
    const nextM = document.getElementById("nextMonthM");
    if(prevM) prevM.onclick = ()=>{
      state.memoryMonth--; if(state.memoryMonth<0){state.memoryMonth=11; state.memoryYear--;}
      state.memoryFilter = "all"; state.editingMemoryId = null; render();
    };
    if(nextM) nextM.onclick = ()=>{
      state.memoryMonth++; if(state.memoryMonth>11){state.memoryMonth=0; state.memoryYear++;}
      state.memoryFilter = "all"; state.editingMemoryId = null; render();
    };

    const prevWeekM = document.getElementById("prevWeekM");
    const nextWeekM = document.getElementById("nextWeekM");
    if(prevWeekM) prevWeekM.onclick = ()=>{
      const d = new Date(state.memoryWeekAnchor+'T00:00:00'); d.setDate(d.getDate()-7);
      state.memoryWeekAnchor = fmtDate(d);
      state.memoryFilter = "all"; state.editingMemoryId = null; render();
    };
    if(nextWeekM) nextWeekM.onclick = ()=>{
      const d = new Date(state.memoryWeekAnchor+'T00:00:00'); d.setDate(d.getDate()+7);
      state.memoryWeekAnchor = fmtDate(d);
      state.memoryFilter = "all"; state.editingMemoryId = null; render();
    };

    document.querySelectorAll("[data-memview]").forEach(b=>{
      b.onclick = ()=>{
        state.memoryView = b.dataset.memview;
        state.memoryFilter = "all"; state.editingMemoryId = null;
        render();
      };
    });

    const reflectToggleBtn = document.getElementById("reflectToggleBtn");
    if(reflectToggleBtn){
      reflectToggleBtn.onclick = ()=>{
        state.reflectionMode = !state.reflectionMode;
        state.editingMemoryId = null;
        if(state.reflectionMode && !state.activeStampId && state.stamps.length>0){
          state.activeStampId = state.stamps[0].id;
        }
        render();
      };
    }

    document.querySelectorAll("[data-stamp]").forEach(b=>{
      b.onclick = ()=>{ state.activeStampId = b.dataset.stamp; render(); };
    });

    const stampQuickAddToggle = document.getElementById("stampQuickAddToggle");
    if(stampQuickAddToggle){
      stampQuickAddToggle.onclick = ()=>{ state.stampQuickAddOpen = !state.stampQuickAddOpen; render(); };
    }
    const quickStampName = document.getElementById("quickStampName");
    if(quickStampName){
      quickStampName.oninput = (e)=>{ state.newStampName = e.target.value; };
    }
    const quickStampAddBtn = document.getElementById("quickStampAddBtn");
    if(quickStampAddBtn){
      quickStampAddBtn.onclick = ()=>{
        const name = (state.newStampName || "").trim();
        if(!name) return;
        const newStamp = {
          id: uid("stamp"),
          name,
          icon: state.newStampIcon || "🏷️",
          color: state.newStampColor
        };
        state.stamps.push(newStamp);
        state.activeStampId = newStamp.id;
        state.newStampName = "";
        state.stampQuickAddOpen = false;
        render();
      };
    }

    document.querySelectorAll("[data-stamp-toggle]").forEach(card=>{
      card.onclick = ()=>{
        if(!state.activeStampId) return;
        const id = card.dataset.stampToggle;
        const tx = state.transactions.find(t=>t.id===id);
        if(!tx) return;
        if(!tx.stamps) tx.stamps = [];
        const idx = tx.stamps.indexOf(state.activeStampId);
        if(idx >= 0) tx.stamps.splice(idx, 1);
        else tx.stamps.push(state.activeStampId);
        render();
      };
    });

    document.querySelectorAll("[data-open-memory]").forEach(card=>{
      card.onclick = ()=>{
        const id = card.dataset.openMemory;
        const tx = state.transactions.find(t=>t.id===id);
        if(!tx) return;
        state.editingMemoryId = id;
        state.editingDraft = { comment: tx.comment || "", amount: String(tx.amount), categoryId: tx.categoryId, photo: tx.photo || null };
        render();
      };
    });

    const editCat = document.querySelector("[data-edit-cat]");
    if(editCat) editCat.onchange = (e)=>{ state.editingDraft.categoryId = e.target.value; };

    document.querySelectorAll("[data-remove-edit-stamp]").forEach(chip=>{
      chip.onclick = ()=>{
        const tx = state.transactions.find(t=>t.id===state.editingMemoryId);
        if(!tx || !tx.stamps) return;
        tx.stamps = tx.stamps.filter(sid=>sid !== chip.dataset.removeEditStamp);
        render();
      };
    });

    const editAmount = document.querySelector("[data-edit-amount]");
    if(editAmount) editAmount.oninput = (e)=>{ state.editingDraft.amount = e.target.value; };

    const editComment = document.querySelector("[data-edit-comment]");
    if(editComment) editComment.oninput = (e)=>{ state.editingDraft.comment = e.target.value; };

    const editPhotoInput = document.getElementById("editPhotoInput");
    const editPhotoAdd = document.querySelector("[data-edit-photo-add]");
    const editPhotoRemove = document.querySelector("[data-edit-photo-remove]");
    if(editPhotoAdd && editPhotoInput) editPhotoAdd.onclick = ()=> editPhotoInput.click();
    if(editPhotoInput){
      editPhotoInput.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{ state.editingDraft.photo = ev.target.result; render(); };
        reader.readAsDataURL(file);
      };
    }
    if(editPhotoRemove) editPhotoRemove.onclick = ()=>{ state.editingDraft.photo = null; render(); };

    const saveMemoryBtn = document.querySelector("[data-save-memory]");
    if(saveMemoryBtn){
      saveMemoryBtn.onclick = ()=>{
        const tx = state.transactions.find(t=>t.id===state.editingMemoryId);
        if(tx){
          const amt = Number(state.editingDraft.amount);
          if(amt > 0) tx.amount = amt;
          if(state.editingDraft.categoryId) tx.categoryId = state.editingDraft.categoryId;
          tx.comment = state.editingDraft.comment;
          tx.photo = state.editingDraft.photo;
        }
        state.editingMemoryId = null;
        render();
      };
    }
    const deleteMemoryBtn = document.querySelector("[data-delete-memory]");
    if(deleteMemoryBtn){
      deleteMemoryBtn.onclick = ()=>{
        state.transactions = state.transactions.filter(t=>t.id !== state.editingMemoryId);
        state.editingMemoryId = null;
        render();
      };
    }
    const cancelMemoryBtn = document.querySelector("[data-cancel-memory]");
    if(cancelMemoryBtn){
      cancelMemoryBtn.onclick = ()=>{ state.editingMemoryId = null; render(); };
    }
  }

  if(state.tab==="settings"){
    document.querySelectorAll("[data-sub]").forEach(b=>{
      b.onclick = ()=>{
        state.settingsSubTab = b.dataset.sub;
        state.catSelectMode = false;
        state.catSelectedIds = [];
        state.catDeleteConfirm = false;
        state.accountDeleteConfirm = false;
        render();
      };
    });

    if(state.settingsSubTab === "account"){
      const settingsGoogleSignInBtn = document.getElementById("settingsGoogleSignInBtn");
      if(settingsGoogleSignInBtn){
        settingsGoogleSignInBtn.onclick = ()=>{
          const provider = new firebase.auth.GoogleAuthProvider();
          fbAuth.signInWithPopup(provider).catch(e=>{
            console.warn("ログインに失敗しました", e);
            alert("ログインに失敗しました。もう一度お試しください。");
          });
        };
      }
      const logoutBtn = document.getElementById("logoutBtn");
      if(logoutBtn){
        logoutBtn.onclick = ()=>{
          fbAuth.signOut().catch(e=> console.warn("ログアウトに失敗しました", e));
        };
      }
      const accountDeleteBtn = document.getElementById("accountDeleteBtn");
      if(accountDeleteBtn){
        accountDeleteBtn.onclick = ()=>{ state.accountDeleteConfirm = true; render(); };
      }
      const accountDeleteCancelBtn = document.getElementById("accountDeleteCancelBtn");
      if(accountDeleteCancelBtn){
        accountDeleteCancelBtn.onclick = ()=>{ state.accountDeleteConfirm = false; render(); };
      }
      const accountDeleteConfirmBtn = document.getElementById("accountDeleteConfirmBtn");
      if(accountDeleteConfirmBtn){
        accountDeleteConfirmBtn.onclick = ()=>{
          const user = state.authUser;
          if(!user) return;
          const docRef = fbDb.collection("kakeibo_users").doc(user.uid);

          docRef.delete()
            .catch(e=> console.warn("クラウドデータの削除に失敗しました", e))
            .then(()=>{
              // クラウド削除の成否に関わらず、端末側の記録データも必ずクリアする
              // （これをしないと、認証削除が失敗して再度ログインした際に古いデータがクラウドへ復元されてしまう）
              state.transactions = [];
              state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
              state.budgets = {};
              state.fixedCosts = [];
              state.stamps = JSON.parse(JSON.stringify(DEFAULT_STAMPS));
              state.excludeUnbudgeted = false;
              state.showDiningStat = true;
              try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}

              return user.delete();
            })
            .catch(e=>{
              console.warn("アカウント削除に失敗しました", e);
              if(e && e.code === "auth/requires-recent-login"){
                alert("セキュリティのため、アカウント削除には再ログインが必要です。一度ログアウトしますので、再度ログインしてからもう一度お試しください（記録データはすでに削除されています）。");
                fbAuth.signOut();
              } else {
                alert("アカウント削除中にエラーが発生しました。もう一度お試しください。");
              }
            })
            .finally(()=>{
              state.accountDeleteConfirm = false;
              render();
            });
        };
      }
    }

    if(state.settingsSubTab === "data"){
      document.querySelectorAll("[data-csvperiod]").forEach(b=>{
        b.onclick = ()=>{ state.csvPeriodMode = b.dataset.csvperiod; render(); };
      });
      const csvPrevMonth = document.getElementById("csvPrevMonth");
      const csvNextMonth = document.getElementById("csvNextMonth");
      if(csvPrevMonth) csvPrevMonth.onclick = ()=>{
        state.csvMonth--; if(state.csvMonth<0){state.csvMonth=11; state.csvYear--;}
        render();
      };
      if(csvNextMonth) csvNextMonth.onclick = ()=>{
        state.csvMonth++; if(state.csvMonth>11){state.csvMonth=0; state.csvYear++;}
        render();
      };

      const csvIncludeDining = document.getElementById("csvIncludeDining");
      const csvIncludeComment = document.getElementById("csvIncludeComment");
      const csvIncludeStamps = document.getElementById("csvIncludeStamps");
      const csvIncludeFixed = document.getElementById("csvIncludeFixed");
      if(csvIncludeDining) csvIncludeDining.onchange = (e)=>{ state.csvIncludeDining = e.target.checked; };
      if(csvIncludeComment) csvIncludeComment.onchange = (e)=>{ state.csvIncludeComment = e.target.checked; };
      if(csvIncludeStamps) csvIncludeStamps.onchange = (e)=>{ state.csvIncludeStamps = e.target.checked; };
      if(csvIncludeFixed) csvIncludeFixed.onchange = (e)=>{ state.csvIncludeFixed = e.target.checked; };

      const exportCsvBtn = document.getElementById("exportCsvBtn");
      if(exportCsvBtn){
        exportCsvBtn.onclick = ()=>{
          try{
            exportTransactionsCSV();
          }catch(e){
            console.warn("CSV書き出しに失敗しました", e);
            alert("CSVの書き出しに失敗しました。もう一度お試しください。");
          }
        };
      }
    }

    if(state.settingsSubTab === "budget"){
      document.querySelectorAll("[data-budget-cat]").forEach(inp=>{
        inp.onchange = (e)=>{
          const cid = inp.dataset.budgetCat;
          const val = Number(e.target.value);
          if(val > 0) state.budgets[cid] = val;
          else delete state.budgets[cid];
          render();
        };
      });
      const excludeToggle = document.getElementById("excludeToggle");
      if(excludeToggle){
        excludeToggle.onchange = (e)=>{ state.excludeUnbudgeted = e.target.checked; };
      }
    }

    if(state.settingsSubTab === "display"){
      const showDiningToggle = document.getElementById("showDiningToggle");
      if(showDiningToggle){
        showDiningToggle.onchange = (e)=>{ state.showDiningStat = e.target.checked; };
      }
      const showBentoToggle = document.getElementById("showBentoToggle");
      if(showBentoToggle){
        showBentoToggle.onchange = (e)=>{ state.showBentoOption = e.target.checked; };
      }
    }

    if(state.settingsSubTab === "stamps"){
      document.querySelectorAll("[data-del-stamp]").forEach(b=>{
        b.onclick = ()=>{
          const delId = b.dataset.delStamp;
          state.stamps = state.stamps.filter(s=>s.id !== delId);
          state.transactions.forEach(t=>{ if(t.stamps) t.stamps = t.stamps.filter(sid=>sid!==delId); });
          if(state.activeStampId === delId) state.activeStampId = state.stamps[0] ? state.stamps[0].id : null;
          if(state.expandedStampId === delId) state.expandedStampId = null;
          render();
        };
      });

      const newStampIcon = document.getElementById("newStampIcon");
      const newStampName = document.getElementById("newStampName");
      if(newStampIcon) newStampIcon.oninput = (e)=>{ state.newStampIcon = e.target.value; };
      if(newStampName) newStampName.oninput = (e)=>{ state.newStampName = e.target.value; };

      document.querySelectorAll("[data-stampswatch]").forEach(b=>{
        b.onclick = ()=>{ state.newStampColor = b.dataset.stampswatch; render(); };
      });

      const addStampBtn = document.getElementById("addStampBtn");
      if(addStampBtn){
        addStampBtn.onclick = ()=>{
          const name = (state.newStampName || "").trim();
          if(!name) return;
          state.stamps.push({
            id: uid("stamp"),
            name,
            icon: state.newStampIcon || "🏷️",
            color: state.newStampColor
          });
          state.newStampName = "";
          state.newStampIcon = "🏷️";
          render();
        };
      }
    }

    if(state.settingsSubTab === "fixed"){
      const fcType = document.getElementById("fcType");
      const fcCat = document.getElementById("fcCat");
      const fcAmount = document.getElementById("fcAmount");
      const fcDay = document.getElementById("fcDay");
      const fcEndDate = document.getElementById("fcEndDate");
      if(fcType) fcType.onchange = (e)=>{
        state.fcType = e.target.value;
        const firstOfType = state.categories.find(c=>c.type===state.fcType);
        state.fcCat = firstOfType ? firstOfType.id : state.fcCat;
        render();
      };
      if(fcCat) fcCat.onchange = (e)=>{ state.fcCat = e.target.value; };
      if(fcAmount) fcAmount.oninput = (e)=>{ state.fcAmount = e.target.value; };
      if(fcDay) fcDay.onchange = (e)=>{ state.fcDay = e.target.value; };
      if(fcEndDate) fcEndDate.onchange = (e)=>{ state.fcEndDate = e.target.value; };

      const addBtn = document.getElementById("addFixedBtn");
      if(addBtn){
        addBtn.onclick = ()=>{
          if(!state.fcAmount || Number(state.fcAmount) <= 0) return;
          state.fixedCosts.push({
            id: uid("fc"),
            type: state.fcType,
            categoryId: state.fcCat,
            amount: Number(state.fcAmount),
            day: Number(state.fcDay),
            endDate: state.fcEndDate || null,
            memo: ""
          });
          state.fcAmount = "";
          state.fcEndDate = "";
          render();
        };
      }

      document.querySelectorAll("[data-del-fixed]").forEach(b=>{
        b.onclick = ()=>{
          state.fixedCosts = state.fixedCosts.filter(fc=>fc.id !== b.dataset.delFixed);
          render();
        };
      });
    }

    if(state.settingsSubTab === "category"){
      document.querySelectorAll("[data-cat-edit-open]").forEach(nm=>{
        nm.onclick = ()=>{
          const id = nm.dataset.catEditOpen;
          const cat = state.categories.find(c=>c.id===id);
          if(!cat) return;
          state.editingCatId = id;
          state.editCatIcon = cat.icon;
          state.editCatName = cat.name;
          render();
        };
      });

      const catEditIcon = document.getElementById("catEditIcon");
      const catEditName = document.getElementById("catEditName");
      if(catEditIcon) catEditIcon.oninput = (e)=>{ state.editCatIcon = e.target.value; };
      if(catEditName) catEditName.oninput = (e)=>{ state.editCatName = e.target.value; };

      document.querySelectorAll("[data-cat-save]").forEach(b=>{
        b.onclick = ()=>{
          const id = b.dataset.catSave;
          const cat = state.categories.find(c=>c.id===id);
          if(cat){
            const trimmedName = (state.editCatName || "").trim();
            if(trimmedName) cat.name = trimmedName;
            cat.icon = state.editCatIcon || cat.icon;
          }
          state.editingCatId = null;
          render();
        };
      });
      document.querySelectorAll("[data-cat-cancel]").forEach(b=>{
        b.onclick = ()=>{ state.editingCatId = null; render(); };
      });

      document.querySelectorAll("[data-cat-drag]").forEach(handle=>{
        handle.onpointerdown = (e)=>{
          e.preventDefault();
          const dragId = handle.dataset.catDrag;
          const dragCat = state.categories.find(c=>c.id===dragId);
          if(!dragCat) return;
          const itemEl = handle.closest(".cat-list-item");
          if(itemEl) itemEl.classList.add("dragging");

          let indicator = document.getElementById("catDropIndicator");
          if(!indicator){
            indicator = document.createElement("div");
            indicator.id = "catDropIndicator";
            indicator.className = "cat-drop-indicator";
            document.body.appendChild(indicator);
          }

          // pendingInsertBeforeId: 挿入先の直前にくる項目のid。nullなら末尾に挿入。
          let pendingInsertBeforeId = undefined; // undefined = 未決定（動かしていない）

          const onMove = (moveEvt)=>{
            const y = moveEvt.clientY;
            const items = Array.from(document.querySelectorAll(`.cat-list-item[data-cat-type="${dragCat.type}"]`))
              .filter(el=>el.dataset.catId !== dragId);
            if(items.length === 0) return;

            let insertBeforeEl = null;
            for(const el of items){
              const rect = el.getBoundingClientRect();
              const mid = rect.top + rect.height/2;
              if(y < mid){ insertBeforeEl = el; break; }
            }

            const listRect = items[0].getBoundingClientRect();
            const containerLeft = listRect.left;
            const containerWidth = listRect.width;

            let lineTop;
            if(insertBeforeEl){
              lineTop = insertBeforeEl.getBoundingClientRect().top - 2;
              pendingInsertBeforeId = insertBeforeEl.dataset.catId;
            } else {
              const lastRect = items[items.length-1].getBoundingClientRect();
              lineTop = lastRect.bottom - 2;
              pendingInsertBeforeId = null;
            }

            indicator.style.display = "block";
            indicator.style.left = containerLeft + "px";
            indicator.style.width = containerWidth + "px";
            indicator.style.top = lineTop + "px";
          };

          const onUp = ()=>{
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
            document.removeEventListener("pointercancel", onUp);
            indicator.style.display = "none";

            if(pendingInsertBeforeId !== undefined){
              const fromIdx = state.categories.findIndex(c=>c.id===dragId);
              if(fromIdx >= 0){
                const [moved] = state.categories.splice(fromIdx, 1);
                if(pendingInsertBeforeId === null){
                  // 同じ種別グループの末尾に挿入
                  let lastIdxOfType = -1;
                  state.categories.forEach((c,i)=>{ if(c.type===dragCat.type) lastIdxOfType = i; });
                  state.categories.splice(lastIdxOfType+1, 0, moved);
                } else {
                  const toIdx = state.categories.findIndex(c=>c.id===pendingInsertBeforeId);
                  state.categories.splice(toIdx >= 0 ? toIdx : state.categories.length, 0, moved);
                }
              }
            }
            render();
          };
          document.addEventListener("pointermove", onMove);
          document.addEventListener("pointerup", onUp);
          document.addEventListener("pointercancel", onUp);
        };
      });

      const catSelectModeToggle = document.getElementById("catSelectModeToggle");
      if(catSelectModeToggle){
        catSelectModeToggle.onclick = ()=>{
          state.catSelectMode = !state.catSelectMode;
          state.catSelectedIds = [];
          state.catDeleteConfirm = false;
          state.editingCatId = null;
          render();
        };
      }

      document.querySelectorAll("[data-cat-select]").forEach(item=>{
        item.onclick = ()=>{
          const id = item.dataset.catSelect;
          const idx = state.catSelectedIds.indexOf(id);
          if(idx >= 0) state.catSelectedIds.splice(idx, 1);
          else state.catSelectedIds.push(id);
          render();
        };
      });

      const catDeleteSelectedBtn = document.getElementById("catDeleteSelectedBtn");
      if(catDeleteSelectedBtn){
        catDeleteSelectedBtn.onclick = ()=>{
          if(state.catSelectedIds.length === 0) return;
          state.catDeleteConfirm = true;
          render();
        };
      }

      const catDeleteConfirmBtn = document.getElementById("catDeleteConfirmBtn");
      if(catDeleteConfirmBtn){
        catDeleteConfirmBtn.onclick = ()=>{
          const idsToDelete = state.catSelectedIds.filter(id => state.categories.length - state.catSelectedIds.length >= 1);
          idsToDelete.forEach(delId=>{
            if(state.categories.length <= 1) return;
            const delCat = state.categories.find(c=>c.id===delId);
            if(!delCat) return;
            state.categories = state.categories.filter(c=>c.id !== delId);
            delete state.budgets[delId];
            const fallback = state.categories.find(c=>c.type===delCat.type) || state.categories[0];
            state.transactions.forEach(t=>{ if(t.categoryId===delId) t.categoryId = fallback.id; });
            state.fixedCosts.forEach(fc=>{ if(fc.categoryId===delId) fc.categoryId = fallback.id; });
            if(state.inputCat===delId) state.inputCat = fallback.id;
            if(state.fcCat===delId) state.fcCat = fallback.id;
          });
          state.catSelectedIds = [];
          state.catSelectMode = false;
          state.catDeleteConfirm = false;
          render();
        };
      }
      const catDeleteCancelBtn = document.getElementById("catDeleteCancelBtn");
      if(catDeleteCancelBtn){
        catDeleteCancelBtn.onclick = ()=>{ state.catDeleteConfirm = false; render(); };
      }

      document.querySelectorAll("[data-newcattype]").forEach(b=>{
        b.onclick = ()=>{ state.newCatType = b.dataset.newcattype; render(); };
      });

      const newCatIcon = document.getElementById("newCatIcon");
      const newCatName = document.getElementById("newCatName");
      const newCatDining = document.getElementById("newCatDining");
      if(newCatIcon) newCatIcon.oninput = (e)=>{ state.newCatIcon = e.target.value; };
      if(newCatName) newCatName.oninput = (e)=>{ state.newCatName = e.target.value; };
      if(newCatDining) newCatDining.onchange = (e)=>{ state.newCatDining = e.target.checked; };

      document.querySelectorAll("[data-swatch]").forEach(b=>{
        b.onclick = ()=>{ state.newCatColor = b.dataset.swatch; render(); };
      });

      const addCatBtn = document.getElementById("addCatBtn");
      if(addCatBtn){
        addCatBtn.onclick = ()=>{
          const name = (state.newCatName || "").trim();
          if(!name) return;
          state.categories.push({
            id: uid("cat"),
            name,
            icon: state.newCatIcon || "🏷️",
            color: state.newCatColor,
            type: state.newCatType,
            diningOutEnabled: state.newCatDining
          });
          state.newCatName = "";
          state.newCatIcon = "🏷️";
          state.newCatDining = false;
          render();
        };
      }
    }
  }

  const gearBtn = document.getElementById("gearBtn");
  if(gearBtn){
    gearBtn.onclick = ()=>{ state.tab = "settings"; render(); };
  }

  // 電卓ボトムシート（どのタブの上にも被さるため、他のタブブロックの外側で処理）
  const sheetEl = document.getElementById("calcSheet");
  if(sheetEl && state.calcOpen){
    sheetEl.querySelectorAll(".calc-key").forEach(b=>{
      b.onclick = ()=>{
        const k = b.dataset.key;
        if(state.inputAmount.length < 9){
          state.inputAmount = state.inputAmount==="0" ? k : state.inputAmount + k;
        }
        render();
      };
    });
    const calcAcBtn = document.getElementById("calcAcBtn");
    if(calcAcBtn){
      calcAcBtn.onclick = ()=>{ state.inputAmount = ""; render(); };
    }
    const calcDelBtn = document.getElementById("calcDelBtn");
    if(calcDelBtn){
      calcDelBtn.onclick = ()=>{ state.inputAmount = state.inputAmount.slice(0,-1); render(); };
    }
    const calcOkBtn = document.getElementById("calcOkBtn");
    if(calcOkBtn){
      calcOkBtn.onclick = ()=>{ state.calcOpen = false; render(); };
    }
  }
  const calcBackdrop = document.getElementById("calcBackdrop");
  if(calcBackdrop){
    calcBackdrop.onclick = ()=>{ if(state.calcOpen){ state.calcOpen = false; render(); } };
  }

  // 日付ドラムピッカー
  const dateSheetEl = document.getElementById("datePickerSheet");
  if(dateSheetEl && state.datePickerOpen){
    const wheelYear = document.getElementById("wheelYear");
    const wheelMonth = document.getElementById("wheelMonth");
    const wheelDay = document.getElementById("wheelDay");

    let yearTimer = null, monthTimer = null, dayTimer = null;

    if(wheelYear){
      wheelYear.onscroll = ()=>{
        clearTimeout(yearTimer);
        yearTimer = setTimeout(()=>{
          const idx = Math.round(wheelYear.scrollTop / WHEEL_ROW_HEIGHT);
          const years = [];
          for(let y=2023; y<=2030; y++) years.push(y);
          const clamped = Math.max(0, Math.min(idx, years.length-1));
          state.datePickerYear = years[clamped];
          refreshDayWheel();
        }, 130);
      };
    }
    if(wheelMonth){
      wheelMonth.onscroll = ()=>{
        clearTimeout(monthTimer);
        monthTimer = setTimeout(()=>{
          const idx = Math.round(wheelMonth.scrollTop / WHEEL_ROW_HEIGHT);
          const months = Array.from({length:12},(_,i)=>i+1);
          const clamped = Math.max(0, Math.min(idx, months.length-1));
          state.datePickerMonth = months[clamped];
          refreshDayWheel();
        }, 130);
      };
    }
    if(wheelDay){
      wheelDay.onscroll = ()=>{
        clearTimeout(dayTimer);
        dayTimer = setTimeout(()=>{
          const idx = Math.round(wheelDay.scrollTop / WHEEL_ROW_HEIGHT);
          const dim = daysInMonthOf(state.datePickerYear, state.datePickerMonth-1);
          const days = Array.from({length:dim},(_,i)=>i+1);
          const clamped = Math.max(0, Math.min(idx, days.length-1));
          state.datePickerDay = days[clamped];
        }, 130);
      };
    }

    const datePickerOkBtn = document.getElementById("datePickerOkBtn");
    if(datePickerOkBtn){
      datePickerOkBtn.onclick = ()=>{
        const y = state.datePickerYear;
        const m = String(state.datePickerMonth).padStart(2,'0');
        const d = String(state.datePickerDay).padStart(2,'0');
        state.inputDate = `${y}-${m}-${d}`;
        state.datePickerOpen = false;
        render();
      };
    }
  }
  const datePickerBackdrop = document.getElementById("datePickerBackdrop");
  if(datePickerBackdrop){
    datePickerBackdrop.onclick = ()=>{ if(state.datePickerOpen){ state.datePickerOpen = false; render(); } };
  }

  const stampCompleteBtn = document.getElementById("stampCompleteBtn");
  if(stampCompleteBtn){
    stampCompleteBtn.onclick = ()=>{ state.reflectionMode = false; render(); };
  }
}

loadState();
state.guestMode = loadGuestMode();
if(state.guestMode){ state.authReady = true; }
render();

// ホーム画面アイコンなどから開き直した際、バックグラウンド復帰で
// 以前のタブのまま表示されることがあるため、毎回ホーム画面（入力タブ）から始まるようにする
window.addEventListener("pageshow", ()=>{
  state.tab = "input";
  if(state.authReady) render();
});

fbAuth.onAuthStateChanged((user)=>{
  state.authReady = true;
  if(user){
    state.authUser = user;
    state.guestMode = false;
    saveGuestMode(false);
    const docRef = fbDb.collection("kakeibo_users").doc(user.uid);
    docRef.get().then((snap)=>{
      if(snap.exists){
        const cloud = snap.data();
        Object.keys(cloud).forEach(key=>{
          if(cloud[key] !== undefined) state[key] = cloud[key];
        });
      } else {
        // 初回ログイン：端末内(localStorage)のデータをクラウドへ移行
        docRef.set(getPersistData(), { merge: true }).catch(e=> console.warn("初回同期に失敗しました", e));
      }
      render();
    }).catch(e=>{
      console.warn("クラウドデータの取得に失敗しました", e);
      render();
    });
  } else {
    state.authUser = null;
    render();
  }
});
</script>
</body>
</html>
