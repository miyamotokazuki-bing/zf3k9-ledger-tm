<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A38;
    --paper:#F2E9DA;
    --paperDeep:#E7DCC6;
    --gold:#B4863E;
    --bengara:#8B3A2B;
    --moss:#55614B;
    --cream:#FBF7EE;
    --line:#D8CBAE;
    --ink60:rgba(27,42,56,0.6);
    --ink40:rgba(27,42,56,0.4);
    --neu-dark:#D6C9AC;
    --neu-light:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 0;
    background:linear-gradient(180deg,#DCD0B4 0%, #C9BC9C 100%);
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .phone{
    width:380px;
    max-width:94vw;
    height:760px;
    background:var(--paper);
    border-radius:34px;
    border:8px solid var(--ink);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    position:relative;
  }
  .header{
    background:var(--ink);
    padding:16px 18px 14px;
    flex:0 0 auto;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .header .title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:19px;
    color:var(--cream);
    letter-spacing:1px;
  }
  .header .sub{
    font-size:10.5px;
    color:rgba(251,247,238,0.55);
    margin-top:2px;
  }
  .gear-btn{
    background:transparent;
    border:1px solid rgba(251,247,238,0.3);
    border-radius:50%;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    margin-top:2px;
  }
  .content{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .nav{
    display:flex;
    border-top:1px solid var(--line);
    background:var(--cream);
    flex:0 0 auto;
  }
  .nav button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    color:var(--ink40);
  }
  .nav button.active{ color:var(--gold); }
  .nav button .label{
    font-size:9px;
    color:var(--ink40);
  }
  .nav button.active .label{ color:var(--ink); font-weight:700; }
  .nav svg{ width:18px; height:18px; }

  /* ---- Input tab ---- */
  .pad{ padding:16px 16px 8px; }
  .switch{
    display:flex;
    border-radius:999px;
    background:var(--paperDeep);
    padding:4px;
    margin-bottom:14px;
  }
  .switch button{
    flex:1;
    padding:8px 0;
    border-radius:999px;
    border:none;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    color:var(--ink60);
    background:transparent;
  }
  .switch button.active{ color:var(--cream); background:var(--ink); }

  .date-row{
    margin-bottom:10px;
  }

// 固定費から指定月の仮想取引を生成
function exportTransactionsCSV(){
  const headers = ["日付","種別","カテゴリ","金額"];
  if(state.csvIncludeDining) headers.push("外食/自炊");
  if(state.csvIncludeComment) headers.push("コメント");
  if(state.csvIncludeStamps) headers.push("烙印");
  if(state.csvIncludeFixed) headers.push("固定費");

  const escapeCsv = (v)=>{
    const s = (v===null || v===undefined) ? "" : String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  };

  const monthKeyForCsv = `${state.csvYear}-${String(state.csvMonth+1).padStart(2,'0')}`;
  const targetTx = state.csvPeriodMode === "month"
    ? state.transactions.filter(t=>t.date.startsWith(monthKeyForCsv))
    : state.transactions;

  const rows = targetTx
    .slice()
    .sort((a,b)=> a.date < b.date ? -1 : 1)
    .map(t=>{
      const cat = catOf(t.categoryId);
      const stampNames = (t.stamps||[]).map(sid=>{
        const s = state.stamps.find(x=>x.id===sid);
        return s ? s.name : "";
      }).filter(Boolean).join("、");
      const diningLabel = t.diningOut===true ? "外食" : t.diningOut===false ? "自炊" : t.diningOut==="bento" ? "弁当" : "";
      const row = [
        t.date,
        t.type==="income" ? "収入" : "支出",
        cat ? cat.name : "",
        t.amount,
      ];
      if(state.csvIncludeDining) row.push(diningLabel);
      if(state.csvIncludeComment) row.push(t.comment || "");
      if(state.csvIncludeStamps) row.push(stampNames);
      if(state.csvIncludeFixed) row.push(t.isFixed ? "固定費" : "");
      return row.map(escapeCsv).join(",");
    });
  const csv = "\uFEFF" + [headers.map(escapeCsv).join(","), ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const suffix = state.csvPeriodMode === "month" ? monthKeyForCsv.replace("-","") : TODAY.replace(/-/g,"");
  a.href = url;
  a.download = `omoide-kakeibo_${suffix}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function moveCategory(id, direction){
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  const sameType = state.categories.filter(c=>c.type===cat.type);
  const idx = sameType.findIndex(c=>c.id===id);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= sameType.length) return;
  const otherCat = sameType[swapIdx];
  const realIdx1 = state.categories.findIndex(c=>c.id===cat.id);
  const realIdx2 = state.categories.findIndex(c=>c.id===otherCat.id);
  const tmp = state.categories[realIdx1];
  state.categories[realIdx1] = state.categories[realIdx2];
  state.categories[realIdx2] = tmp;
}

function fixedTxForMonth(year, month){
  const dim = daysInMonthOf(year, month);
  return state.fixedCosts.map(fc=>{
    const day = Math.min(fc.day, dim);
    const date = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if(fc.endDate && date > fc.endDate) return null;
    return {
      id: "fixed-"+fc.id+"-"+year+"-"+month,
      date, type: fc.type, categoryId: fc.categoryId, amount: fc.amount,
      comment: fc.memo || "", photo: null, isFixed:true, diningOut:null, stamps:[]
    };
  }).filter(Boolean);
}

// 指定日の全取引（実記録＋固定費）を返す
function txForDate(dateStr){
  const [y,m] = dateStr.split('-').map(Number);
  const fixed = fixedTxForMonth(y, m-1).filter(t=>t.date===dateStr);
  const real = state.transactions.filter(t=>t.date===dateStr);
  return real.concat(fixed);
}

let firestoreSaveTimer = null;
function saveToFirestore(){
  if(!state.authUser) return;
  clearTimeout(firestoreSaveTimer);
  firestoreSaveTimer = setTimeout(()=>{
    fbDb.collection("kakeibo_users").doc(state.authUser.uid).set(getPersistData(), { merge: true })
      .catch(e=> console.warn("クラウド保存に失敗しました", e));
  }, 600);
}

function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getPersistData()));
    }catch(e){
      console.warn("保存に失敗しました", e);
    }
  }, 150);
  saveToFirestore();
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && typeof saved === "object"){
      Object.keys(saved).forEach(key=>{
        if(saved[key] !== undefined) state[key] = saved[key];
      });
    }
  }catch(e){
    console.warn("読み込みに失敗しました", e);
  }
}

}

    {k:"settings", label:"設定", svg:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>'}
  ];
  const nav = document.getElementById("nav");
  nav.innerHTML = tabs.map(t=>`
    <button data-tab="${t.k}" class="${state.tab===t.k?'active':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="${state.tab===t.k?TOKENS.gold:'rgba(27,42,56,0.4)'}" stroke-width="${state.tab===t.k?2.4:1.8}" stroke-linecap="round" stroke-linejoin="round">${t.svg}</svg>

  });
}
